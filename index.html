<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root{
    --bg:#FAF3E7; --surface:#FFFFFF; --surface-2:#F1E4D0;
    --ink:#241A2E; --ink-soft:#5B4F63;
    --accent:#D9622B; --accent-ink:#FFF9F2;
    --ok:#3F6C51; --ok-bg:#E4EEE6;
    --warn:#B23A48; --warn-bg:#F6E3E1;
    --line:#E4D3B8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17121D; --surface:#211A29; --surface-2:#2B2233;
      --ink:#F4ECE0; --ink-soft:#C9BBC9;
      --accent:#F0904F; --accent-ink:#1B1220;
      --ok:#8FCBA3; --ok-bg:#213326;
      --warn:#F0A0A9; --warn-bg:#3A2126;
      --line:#3A2E44;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17121D; --surface:#211A29; --surface-2:#2B2233;
    --ink:#F4ECE0; --ink-soft:#C9BBC9;
    --accent:#F0904F; --accent-ink:#1B1220;
    --ok:#8FCBA3; --ok-bg:#213326;
    --warn:#F0A0A9; --warn-bg:#3A2126;
    --line:#3A2E44;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
  a{ color:var(--accent); }

  .wrap{ max-width:640px; margin:0 auto; padding-inline:16px; }

  /* Header */
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding-block:14px 10px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:2px;
  }
  header.top h1{ font-size:22px; font-weight:600; }
  .status-chip{
    display:inline-flex; align-items:center; gap:6px;
    margin-top:8px; padding:5px 10px; border-radius:99px;
    background:var(--surface-2); color:var(--ink);
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500;
  }
  .status-chip .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); }

  /* Day tabs */
  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; margin-top:12px;
    padding-bottom:2px; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:0 0 auto; appearance:none; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:500;
    padding:8px 12px; border-radius:10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; line-height:1.2;
  }
  nav.tabs button .d{ font-size:10px; opacity:.75; }
  nav.tabs button[aria-selected="true"]{
    background:var(--ink); color:var(--bg); border-color:var(--ink);
  }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  main{ padding-block:18px 40px; }
  section.view[hidden]{ display:none; }

  .day-title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .day-title h2{ font-size:21px; }
  .park-badge{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);
    background:var(--surface-2); padding:3px 8px; border-radius:6px; white-space:nowrap;
  }

  /* Timeline */
  ol.timeline{ list-style:none; margin:16px 0 0; padding:0; position:relative; }
  ol.timeline::before{
    content:""; position:absolute; left:19px; top:6px; bottom:6px; width:1.5px;
    background:var(--line);
  }
  ol.timeline li{ position:relative; padding-left:48px; margin-bottom:14px; }
  .node{
    position:absolute; left:0; top:0; width:39px; height:39px; border-radius:50%;
    background:var(--surface); border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  li.done .node{ background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
  .node svg{ width:18px; height:18px; }

  .stop-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px;
  }
  li.ticket .stop-card{
    border-color:var(--accent); background:linear-gradient(180deg, var(--surface), var(--surface) 100%);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .stop-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .stop-time{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--accent); font-weight:600; }
  .check{
    appearance:none; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line);
    background:var(--surface); cursor:pointer; flex:0 0 auto; position:relative;
  }
  .check:checked{ background:var(--ok); border-color:var(--ok); }
  .check:checked::after{
    content:""; position:absolute; left:5px; top:1px; width:5px; height:10px;
    border:solid var(--accent-ink); border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .stop-title{ font-size:15px; font-weight:600; margin-top:3px; }
  .stop-text{ font-size:13.5px; color:var(--ink-soft); margin-top:3px; }
  .tag{
    display:inline-block; margin-top:6px; font-family:'IBM Plex Mono', monospace; font-size:11px;
    font-weight:600; padding:2px 7px; border-radius:6px; background:var(--warn-bg); color:var(--warn);
  }
  li.done .stop-title, li.done .stop-text{ opacity:.55; text-decoration:line-through; }

  .id-row{
    margin-top:9px; padding-top:9px; border-top:1px dashed var(--line);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .id-pair{ display:flex; flex-direction:column; gap:1px; }
  .id-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .id-value{ font-size:14px; font-weight:600; color:var(--ink); }
  .copy-btn{
    margin-left:auto; appearance:none; border:1px solid var(--accent); background:transparent;
    color:var(--accent); font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600;
    padding:6px 10px; border-radius:8px; cursor:pointer;
  }
  .copy-btn:active{ background:var(--accent); color:var(--accent-ink); }

  .note-card{
    margin-top:18px; padding:13px 14px; border-radius:12px;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .note-card h3{ font-size:13.5px; margin-bottom:4px; }
  .note-card p{ margin:0; font-size:13.5px; color:var(--ink-soft); }

  /* Tips view */
  .tip-group{ margin-bottom:20px; }
  .tip-group h3{ font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--accent); margin-bottom:8px; }
  .tip-group ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
  .tip-group li{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:13.5px; color:var(--ink);
  }
  .tip-group li b{ color:var(--ink); }

  .rec-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 12px; margin-bottom:8px;
  }
  .rec-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .rec-name{ font-size:14.5px; font-weight:600; }
  .rec-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .info-pill{
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    padding:2px 7px; border-radius:6px; background:var(--surface-2); color:var(--ink-soft); white-space:nowrap;
  }
  .rec-text{ font-size:13.5px; color:var(--ink-soft); margin-top:5px; }
  .rec-link{ display:inline-block; margin-top:6px; font-size:12.5px; font-weight:600; }

  /* Heights view */
  table.heights{ width:100%; border-collapse:collapse; margin-top:14px; }
  table.heights th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft); padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  table.heights td{ padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  table.heights td:last-child{ text-align:right; }
  .h-pill{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:99px; white-space:nowrap;
  }
  .h-pill.ok{ background:var(--ok-bg); color:var(--ok); }
  .h-pill.warn{ background:var(--warn-bg); color:var(--warn); }
  .heights-note{ font-size:12.5px; color:var(--ink-soft); margin-top:12px; }

  footer.credit{ text-align:center; font-size:11.5px; color:var(--ink-soft); padding:20px 0 10px; }
</style>

        { name:"Rainforest Cafe", rating:"4.3★", price:"€€", text:"El mejor valorado con diferencia. Ambiente selva con peces y animales animatrónicos — entretiene a Jorge y Martina mientras coméis.", link:"https://maps.google.com/?cid=13204123828219928026" },
        { name:"Annette's Diner", rating:"3.9★", price:"€€", text:"Diner americano años 50, camareras sobre patines. Hamburguesas contundentes; servicio irregular según las reseñas.", link:"https://maps.google.com/?cid=18234409281205859866" },
        { name:"La Grange — Billy Bob's", rating:"3.8★", price:"€€", text:"Bufé libre: sin líos de carta con niños cansados, coméis lo que queráis.", link:"https://maps.google.com/?cid=6704123942359421134" }
      ]},
      { group:"Plan B sábado 10 · si no sale Chez Rémy", items:[
        { name:"Stark Factory", rating:"3.4★", price:"€€", text:"Quick-service en Avengers Campus, sin reserva. Pizza y pasta — resuelve rápido con niños cansados.", link:"https://maps.google.com/?cid=2049510466144234211" },
        { name:"The Regal View", rating:"3.9★", price:"€€€€", text:"Cena con princesas en World of Frozen, muy bien valorado pero caro y necesita reserva con antelación — no sirve de última hora.", link:"https://maps.google.com/?cid=4761715765748682813" }
      ]}
    ],
    mustRide: [
      { group:"Imprescindibles para los 4, sin altura mínima", items:[
        { name:"Frozen Ever After", tag:"Adventure World", text:"La atracción más demandada del año, ya es prioridad del sábado." },
        { name:"Phantom Manor", tag:"Disneyland Park", text:"La casa encantada única de este parque, con una historia que no existe en ningún otro Disney. Puede ser intensa para Jorge." }
      ]},
      { group:"Si llegáis a la altura (rider swap)", items:[
        { name:"Crush's Coaster", tag:"107 cm · Adventure World", text:"La atracción con más cola de Disney Adventure World, por algo." },
        { name:"Star Wars Hyperspace Mountain", tag:"120 cm · Disneyland Park", text:"La gran atracción de Disneyland Park." }
      ]}
    ]
  };

  var HEIGHTS = [
    {name:"Avengers Assemble: Flight Force", min:120},
    {name:"RC Racer", min:120},
    {name:"Crush's Coaster", min:107},
    {name:"Big Thunder Mountain", min:102},
    {name:"Tower of Terror", min:102},
    {name:"Spider-Man W.E.B. Adventure", min:102},
    {name:"Frozen Ever After", min:0},
    {name:"Ratatouille: The Adventure", min:0},
    {name:"Cars ROAD TRIP", min:0},
    {name:"Peter Pan's Flight", min:0},
    {name:"Pirates of the Caribbean", min:0},
    {name:"Phantom Manor", min:0, extra:"intensa para 5 años"}
  ];

  function store(key, val){
    try{
      if(val === undefined) return JSON.parse(localStorage.getItem(key));
      localStorage.setItem(key, JSON.stringify(val));
    }catch(e){ /* storage unavailable: continue without persistence */ }
  }

  function fmt(d){ return d.getDate() + "/" + (d.getMonth()+1); }

  function computeStatus(){
    var now = new Date();
    var todayKey = null;
    DAYS.forEach(function(d){
      var dd = new Date(2026,9,parseInt(d.date,10));
      if(now.getFullYear()===dd.getFullYear() && now.getMonth()===dd.getMonth() && now.getDate()===dd.getDate()){
        todayKey = d.id;
      }
    });
    var text;
    if(now < TRIP_START){
      var ms = TRIP_START - now;
      var days = Math.ceil(ms / 86400000);
      text = days === 1 ? "Falta 1 día — 8–11 octubre 2026" : "Faltan " + days + " días — 8–11 octubre 2026";
    } else if(now < TRIP_END_EXCL){
      text = todayKey ? "Hoy toca: " + (DAYS.filter(function(d){return d.id===todayKey;})[0].title) : "¡Estáis en el viaje!";
    } else {
      text = "Viaje completado — 8–11 octubre 2026";
    }
    document.getElementById("statusText").textContent = text;
    return todayKey;
  }

  function renderTabs(activeId){
    var extra = [{id:"recs", label:"RECOM", date:"✦"}, {id:"tips", label:"TIPS", date:"★"}, {id:"heights", label:"ALTURAS", date:"⇕"}];
    var all = DAYS.concat(extra);
    var nav = document.getElementById("tabs");
    nav.innerHTML = "";
    all.forEach(function(d){
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role","tab");
      b.setAttribute("aria-selected", String(d.id===activeId));
      b.dataset.id = d.id;
      b.innerHTML = d.label + '<span class="d">' + d.date + "</span>";
      b.addEventListener("click", function(){ selectView(d.id); });
      nav.appendChild(b);
    });
  }

  function stopNode(dayId, stop, idx){
    var li = document.createElement("li");
    var checkKey = "dlp-check-" + dayId + "-" + idx;
    var isDone = !!store(checkKey);
    li.className = (stop.ticket ? "ticket " : "") + (isDone ? "done" : "");
    li.innerHTML =
      '<span class="node">' + (ICONS[stop.icon] || "") + '</span>' +
      '<div class="stop-card">' +
        '<div class="stop-top">' +
          '<span class="stop-time mono">' + stop.time + '</span>' +
          '<input type="checkbox" class="check" aria-label="Marcar como hecho"' + (isDone ? " checked" : "") + '>' +
        '</div>' +
        '<div class="stop-title">' + stop.title + '</div>' +
        '<div class="stop-text">' + stop.text + '</div>' +
        (stop.tag ? '<span class="tag">' + stop.tag + '</span>' : '') +
        (stop.copyValue ? renderCopyRow(stop) : '') +
      '</div>';
    var cb = li.querySelector(".check");
    cb.addEventListener("change", function(){
      li.classList.toggle("done", cb.checked);
      store(checkKey, cb.checked);
    });
    var copyBtn = li.querySelector(".copy-btn");
    if(copyBtn){
      copyBtn.addEventListener("click", function(){
        var full = stop.copyLabel + " " + stop.copyValue + " · " + stop.copyLabel2 + " " + stop.copyValue2;
        var done = function(){ copyBtn.textContent = "Copiado"; setTimeout(function(){ copyBtn.textContent = "Copiar"; }, 1500); };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(full).then(done, function(){ selectFallback(li); });
        } else {
          selectFallback(li);
        }
      });
    }
    return li;
  }

  function renderCopyRow(stop){
    return '<div class="id-row">' +
      '<div class="id-pair"><span class="id-label">' + stop.copyLabel + '</span><span class="id-value mono">' + stop.copyValue + '</span></div>' +
      '<div class="id-pair"><span class="id-label">' + stop.copyLabel2 + '</span><span class="id-value mono">' + stop.copyValue2 + '</span></div>' +
      '<button type="button" class="copy-btn">Copiar</button>' +
    '</div>';
  }

  function selectFallback(li){
    try{
      var range = document.createRange();
      var node = li.querySelector(".id-row");
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }catch(e){ /* selection unavailable: nothing to fall back to */ }
  }

  function renderDay(day){
    var el = document.createElement("section");
    el.className = "view";
    el.id = "view-" + day.id;

    var head = document.createElement("div");
    head.className = "day-title";
    head.innerHTML = "<h2>" + day.title + "</h2>" + (day.park ? '<span class="park-badge">' + day.park + '</span>' : "");
    el.appendChild(head);

    var ol = document.createElement("ol");
    ol.className = "timeline";
    day.stops.forEach(function(stop, idx){ ol.appendChild(stopNode(day.id, stop, idx)); });
    el.appendChild(ol);

    if(day.note){
      var note = document.createElement("div");
      note.className = "note-card";
      note.innerHTML = "<h3>" + day.note.title + "</h3><p>" + day.note.text + "</p>";
      el.appendChild(note);
    }
    return el;
  }

  function renderTips(){
    var el = document.createElement("section");
    el.className = "view";
    el.id = "view-tips";
    var head = document.createElement("div");
    head.className = "day-title";
    head.innerHTML = "<h2>Para no caer en trampas de turista</h2>";
    el.appendChild(head);
    TIPS.forEach(function(g){
      var group = document.createElement("div");
      group.className = "tip-group";
      var ul = g.items.map(function(t){ return "<li>" + t + "</li>"; }).join("");
      group.innerHTML = "<h3>" + g.group + "</h3><ul>" + ul + "</ul>";
      el.appendChild(group);
    });
    return el;
  }

  function renderRecs(){
    var el = document.createElement("section");
    el.className = "view";
    el.id = "view-recs";
    var head = document.createElement("div");
    head.className = "day-title";
    head.innerHTML = "<h2>Sugerencias y recomendaciones</h2>";
    el.appendChild(head);

    var subhead1 = document.createElement("h3");
    subhead1.className = "tip-group-title-standalone";
    subhead1.style.cssText = "font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:14px 0 8px;";
    subhead1.textContent = "Dónde comer";
    el.appendChild(subhead1);

    RECS.restaurants.forEach(function(g){
      var group = document.createElement("div");
      group.className = "tip-group";
      var cards = g.items.map(function(r){
        return '<div class="rec-card">' +
          '<div class="rec-top"><span class="rec-name">' + r.name + '</span>' +
          '<span class="rec-pills"><span class="info-pill">' + r.rating + '</span><span class="info-pill">' + r.price + '</span></span></div>' +
          '<div class="rec-text">' + r.text + '</div>' +
          '<a class="rec-link" href="' + r.link + '" target="_blank" rel="noopener">Ver en Google Maps →</a>' +
        '</div>';
      }).join("");
      group.innerHTML = "<h3>" + g.group + "</h3>" + cards;
      el.appendChild(group);
    });

    var subhead2 = document.createElement("h3");
    subhead2.style.cssText = "font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin:18px 0 8px;";
    subhead2.textContent = "Qué no os podéis perder";
    el.appendChild(subhead2);

    RECS.mustRide.forEach(function(g){
      var group = document.createElement("div");
      group.className = "tip-group";
      var cards = g.items.map(function(r){
        return '<div class="rec-card">' +
          '<div class="rec-top"><span class="rec-name">' + r.name + '</span>' +
          '<span class="rec-pills"><span class="info-pill">' + r.tag + '</span></span></div>' +
          '<div class="rec-text">' + r.text + '</div>' +
        '</div>';
      }).join("");
      group.innerHTML = "<h3>" + g.group + "</h3>" + cards;
      el.appendChild(group);
    });

    return el;
  }

  function renderHeights(){
    var el = document.createElement("section");
    el.className = "view";
    el.id = "view-heights";
    var head = document.createElement("div");
    head.className = "day-title";
    head.innerHTML = "<h2>Alturas mínimas</h2>";
    el.appendChild(head);
    var rows = HEIGHTS.map(function(h){
      var pill = h.min > 0
        ? '<span class="h-pill warn">' + h.min + ' cm</span>'
        : '<span class="h-pill ok">Sin mínimo</span>';
      var name = h.name + (h.extra ? " <span style=\"color:var(--ink-soft);font-size:12px\">(" + h.extra + ")</span>" : "");
      return "<tr><td>" + name + "</td><td>" + pill + "</td></tr>";
    }).join("");
    var table = document.createElement("table");
    table.className = "heights";
    table.innerHTML = "<thead><tr><th>Atracción</th><th>Requisito</th></tr></thead><tbody>" + rows + "</tbody>";
    el.appendChild(table);
    var p = document.createElement("p");
    p.className = "heights-note";
    p.textContent = "Comprobad la altura real de Jorge y Martina antes de decidir; usad rider swap en las que no lleguen.";
    el.appendChild(p);
    return el;
  }

  var VIEWS = {};
  function buildViews(){
    var main = document.getElementById("main");
    DAYS.forEach(function(d){ var v = renderDay(d); VIEWS[d.id] = v; main.appendChild(v); });
    VIEWS.recs = renderRecs(); main.appendChild(VIEWS.recs);
    VIEWS.tips = renderTips(); main.appendChild(VIEWS.tips);
    VIEWS.heights = renderHeights(); main.appendChild(VIEWS.heights);
  }

  function selectView(id){
    Object.keys(VIEWS).forEach(function(k){ VIEWS[k].hidden = (k !== id); });
    var buttons = document.querySelectorAll("#tabs button");
    buttons.forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.id === id)); });
    store("dlp-last-view", id);
  }

  function boot(){
    buildViews();
    var todayId = computeStatus();
    var initial = todayId || store("dlp-last-view") || "d8";
    if(!VIEWS[initial]) initial = "d8";
    renderTabs(initial);
    selectView(initial);
  }

  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
  } else {
    boot();
  }
})();
</script>
</body>
</html>
